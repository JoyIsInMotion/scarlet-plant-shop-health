name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the local toolchain (Node 24 → npm 11) so the npm 11
          # lockfile (lockfileVersion 3) stays in sync for `npm ci`.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w @scarlet/web

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: web

      - name: Unit tests
        run: npm test -w @scarlet/web
